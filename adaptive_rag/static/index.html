<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AdaptiveRAG</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color-scheme: dark; }
    body { margin:0; background:#0b0d10; color:#eef2f7; }
    main { max-width:1050px; margin:0 auto; padding:34px 20px 60px; }
    h1 { font-size:38px; margin:0; } .sub { color:#98a2b3; margin:8px 0 26px; }
    .panel { background:#13171d; border:1px solid #252b35; border-radius:16px; padding:18px; margin:14px 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    input, select { background:#0e1116; color:#fff; border:1px solid #303744; border-radius:10px; padding:12px; }
    input { flex:1; min-width:250px; } button { border:0; border-radius:10px; padding:12px 16px; font-weight:700; cursor:pointer; }
    button.primary { background:#fff; color:#111; } button.secondary { background:#222833; color:#fff; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-top:12px; }
    .metric { background:#0f1318; padding:12px; border-radius:10px; } .metric b { display:block; font-size:12px; color:#98a2b3; margin-bottom:6px; }
    .hit { border-top:1px solid #252b35; padding:15px 0; } .hit:first-child { border-top:0; }
    .pill { display:inline-block; padding:4px 8px; border-radius:999px; background:#242b36; margin:2px 4px 2px 0; font-size:12px; }
    pre { white-space:pre-wrap; word-break:break-word; color:#cbd5e1; }
    .muted { color:#98a2b3; } .error { color:#ff9f9f; }
  </style>
</head>
<body>
<main>
  <h1>AdaptiveRAG</h1>
  <div class="sub">Query-aware hybrid retrieval • temporal/exact routing • confidence fallback • explainable fusion</div>

  <div class="panel">
    <h3>1. Build index</h3>
    <div class="row">
      <input id="path" value="sample_data" placeholder="Corpus path" />
      <select id="backend"><option value="lsa">LSA (offline)</option><option value="hashing">Hashing (smoke)</option><option value="sentence-transformer">SentenceTransformer</option></select>
      <select id="generation"><option value="extractive">Extractive generator</option><option value="ollama">Ollama generator</option></select>
      <input id="calibration" placeholder="Calibration JSON (optional)" />
      <button class="secondary" onclick="buildIndex()">Build</button>
    </div>
    <div id="buildStatus" class="muted" style="margin-top:10px"></div>
  </div>

  <div class="panel">
    <h3>2. Ask</h3>
    <div class="row">
      <input id="query" value="What happened on 4 September 2026 at 11:42 am?" />
      <button class="primary" onclick="ask()">Retrieve</button>
    </div>
  </div>

  <div id="trace" class="panel" style="display:none"></div>
  <div id="results" class="panel" style="display:none"></div>
</main>
<script>
async function buildIndex(){
  const s=document.getElementById('buildStatus'); s.textContent='Building…';
  try{
    const r=await fetch('/build',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:document.getElementById('path').value,semantic_backend:document.getElementById('backend').value,generation_backend:document.getElementById('generation').value,calibration_path:document.getElementById('calibration').value||null})});
    const j=await r.json(); if(!r.ok) throw new Error(j.detail||'Build failed');
    s.textContent=`Indexed ${j.chunks} chunks with ${j.semantic_backend||j.backend} / ${j.generation_backend||'extractive'}.`;
  }catch(e){s.innerHTML=`<span class="error">${e.message}</span>`}
}
async function ask(){
  const tr=document.getElementById('trace'), res=document.getElementById('results');
  tr.style.display='block'; res.style.display='block'; tr.innerHTML='Retrieving…'; res.innerHTML='';
  try{
    const r=await fetch('/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:document.getElementById('query').value,k:6,generate:true})});
    const j=await r.json(); if(!r.ok) throw new Error(j.detail||'Query failed');
    const t=j.trace;
    tr.innerHTML=`<h3>Retrieval decision</h3><div class="grid">
      <div class="metric"><b>ROUTE</b>${t.route}</div><div class="metric"><b>FIRST STAGE</b>${t.first_stage}</div>
      <div class="metric"><b>CONFIDENCE</b>${t.confidence}</div><div class="metric"><b>THRESHOLD</b>${t.threshold}</div>
      <div class="metric"><b>FALLBACK</b>${t.fallback_triggered}</div><div class="metric"><b>BASE LEX / SEM</b>${t.base_lexical_weight} / ${t.base_semantic_weight}</div>
      <div class="metric"><b>USED LEX / SEM</b>${t.lexical_weight} / ${t.semantic_weight}</div>
    </div><p>${t.reasons.map(x=>`<span class="pill">${escapeHtml(x)}</span>`).join('')}</p>`;
    res.innerHTML=`<h3>Evidence</h3><pre>${escapeHtml(j.answer||'')}</pre>` + j.hits.map((h,i)=>`<div class="hit"><b>#${i+1} ${escapeHtml(h.source)}</b> <span class="pill">${h.channel}</span> <span class="pill">score ${h.score}</span><p>${escapeHtml(h.text)}</p></div>`).join('');
  }catch(e){tr.innerHTML=`<span class="error">${e.message}</span>`}
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body>
</html>
