[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rag"
version = "0.3.0"
description = "Query-aware hybrid RAG with temporal/exact-first routing and confidence-driven fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "fastapi[standard]>=0.115",
  "httpx>=0.27",
  "pypdf>=5.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5.0"]
fastpdf = ["pymupdf>=1.26"]
dev = ["pytest>=8.0"]

[project.scripts]
adaptive-rag = "adaptive_rag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptive_rag*"]

[tool.setuptools.package-data]
adaptive_rag = ["static/*.html"]

[tool.vercel]
entrypoint = "adaptive_rag.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
